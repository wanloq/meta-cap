<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Multi-Video Metadata Logger</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans">

  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Daily Multi-Video Metadata Logger</h1>
    <p class="text-slate-600 mb-6 text-sm">Log worker and device info, add your video files, and split each clip into distinct subtasks.</p>

    <form id="loggerForm" class="space-y-6">
      
      <!-- SECTION 1: USER & DEVICE DETAILS -->
      <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
        <h2 class="text-lg font-semibold text-slate-700">1. User & Device Details</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">User ID *</label>
            <select id="userId" required class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Select Your ID...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Recording Date *</label>
            <input type="date" id="recordingDate" required class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Device Type *</label>
            <select id="deviceType" class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <option>Smartphone</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Brand *</label>
            <select id="brand" required class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Select Brand...</option>
              <option>Samsung</option>
              <option>iPhone</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Model *</label>
            <input type="text" id="model" placeholder="e.g. iPhone 12 Pro Max" required class="w-full p-2 text-sm border rounded">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Storage Capacity *</label>
            <select id="storage" required class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Select Storage...</option>
              <option>64GB</option>
              <option>128GB</option>
              <option>256GB</option>
              <option>512GB</option>
              <option>1TB</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Task Category *</label>
            <select id="taskCategory" required class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Select Category...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Task Sub-Category *</label>
            <select id="taskSubCategory" required class="w-full p-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Select Sub-Category...</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SECTION 2: VIDEO CLIPS & NESTED SUBTASKS -->
      <div class="space-y-4">
        <h2 class="text-lg font-semibold text-slate-700">2. Video Clips Logged Today</h2>

        <div id="videoContainer" class="space-y-6">
          <!-- Dynamic Video Cards appended here -->
        </div>

        <!-- Add Another Video Button at the bottom -->
        <div class="pt-2">
          <button type="button" onclick="addVideoCard()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2.5 px-4 rounded-lg border border-slate-300 transition flex items-center justify-center gap-2">
            <span>+</span> Add Another Video
          </button>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="pt-4 border-t border-slate-200">
        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
          Submit Log
        </button>
      </div>
    </form>
  </div>

  <script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4NKQUjIbHLCOEq2KyKFcnLLDWvfzDb7jitgnFU3PrKKkeAslIigWE43BMtPwhMj0x/exec';

  // 1. PRE-POPULATE USER ID DROPDOWN (TTA001 to TTA100)
  const userSelect = document.getElementById('userId');
  if (userSelect) {
    userSelect.innerHTML = '<option value="">Select User ID...</option>';
    for (let i = 1; i <= 100; i++) {
      const formattedId = `TTA${String(i).padStart(3, '0')}`;
      userSelect.add(new Option(formattedId, formattedId));
    }
  }

  // 2. FETCH CATEGORIES FROM EXTERNAL JSON FILE
  let categoryMap = {};
  const catSelect = document.getElementById('taskCategory');
  const subCatSelect = document.getElementById('taskSubCategory');

  fetch('categories.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('Failed to load categories.json file');
      }
      return response.json();
    })
    .then(data => {
      categoryMap = data;

      // Reset dropdowns
      catSelect.innerHTML = '<option value="">Select Category...</option>';
      subCatSelect.innerHTML = '<option value="">Select Category First...</option>';

      // Populate Category Dropdown
      Object.keys(categoryMap).forEach(category => {
        catSelect.add(new Option(category, category));
      });
    })
    .catch(error => {
      console.error('Error loading external categories file:', error);
      if (catSelect) catSelect.innerHTML = '<option value="">Error loading categories</option>';
    });

  // 3. LISTEN FOR CATEGORY SELECTION CHANGE
  if (catSelect) {
    catSelect.addEventListener('change', function() {
      const selectedCategory = this.value;
      
      // Clear subcategory choices
      subCatSelect.innerHTML = '';

      if (selectedCategory && categoryMap[selectedCategory]) {
        subCatSelect.add(new Option('Select Sub-Category...', ''));
        categoryMap[selectedCategory].forEach(subCat => {
          subCatSelect.add(new Option(subCat, subCat));
        });
        subCatSelect.disabled = false;
      } else {
        subCatSelect.add(new Option('Select Category First...', ''));
        subCatSelect.disabled = true;
      }
    });
  }

  // 4. DYNAMIC VIDEO CARDS & SUBTASKS MANAGEMENT
  let videoCount = 0;

  function addVideoCard() {
    videoCount++;
    const vId = videoCount;
    const container = document.getElementById('videoContainer');
    const card = document.createElement('div');
    card.className = 'video-card bg-slate-50 p-5 rounded-lg border-2 border-slate-300 space-y-4 relative';
    card.id = `videoCard_${vId}`;

    card.innerHTML = `
      <div class="flex justify-between items-center border-b pb-2 border-slate-300">
        <span class="font-bold text-md text-slate-800">Video Clip #${vId}</span>
        ${vId > 1 ? `<button type="button" onclick="removeVideoCard(${vId})" class="text-red-600 text-xs font-semibold hover:underline">Delete Video Clip</button>` : ''}
      </div>

      <!-- MAIN VIDEO PROPERTIES (CONSTANT) -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">File Name *</label>
          <input type="text" name="fileName" placeholder="TTA099-KITCHEN-TASKS-1.MP4" required class="w-full p-2 text-sm border rounded">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">File Type *</label>
          <select name="fileType" class="w-full p-2 text-sm border rounded">
            <option>MP4</option>
            <option>MOV</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">Total Length (MM:SS) *</label>
          <input type="text" name="length" placeholder="05:30" required class="w-full p-2 text-sm border rounded">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">People Count *</label>
          <select name="peopleCount" class="w-full p-2 text-sm border rounded">
            <option>1 person or less</option>
            <option>2 people</option>
            <option>3 people or more</option>
          </select>
        </div>
      </div>

      <!-- SUBTASKS SECTION -->
      <div class="space-y-3 pt-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Subtasks in this Video</span>
          
        </div>

        <div id="subtaskContainer_${vId}" class="space-y-3">
          <!-- Dynamic Subtasks inserted here -->
        </div>
		<button type="button" onclick="addSubtaskCard(${vId})" class="text-xs bg-blue-100 text-blue-700 hover:bg-blue-200 px-2.5 py-1 rounded font-semibold transition">+ Add Subtask</button>
      </div>
    `;
    container.appendChild(card);
    addSubtaskCard(vId); // Add default subtask 1 for this video
  }

  function removeVideoCard(id) {
    const card = document.getElementById(`videoCard_${id}`);
    if (card) card.remove();
  }

  function addSubtaskCard(vId) {
    const subContainer = document.getElementById(`subtaskContainer_${vId}`);
    if (!subContainer) return;
    
    const subCount = subContainer.children.length + 1;
    const subCard = document.createElement('div');
    subCard.className = 'subtask-card bg-white p-4 rounded border border-slate-200 space-y-3 shadow-sm';

    subCard.innerHTML = `
      <div class="flex justify-between items-center border-b pb-1">
        <span class="text-xs font-bold text-slate-600">Subtask #${subCount}</span>
        ${subCount > 1 ? `<button type="button" onclick="this.closest('.subtask-card').remove()" class="text-red-500 text-xs hover:underline">Remove Subtask</button>` : ''}
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div><label class="block text-xs text-slate-600">Task Done *</label><input type="text" name="taskRecorded" placeholder="e.g. Sorting" required class="w-full p-2 text-sm border rounded"></div>
        <div><label class="block text-xs text-slate-600">Start Time (MM:SS) *</label><input type="text" name="startTime" placeholder="00:00" required class="w-full p-2 text-sm border rounded"></div>
        <div><label class="block text-xs text-slate-600">Finish Time (MM:SS) *</label><input type="text" name="finishTime" placeholder="01:30" required class="w-full p-2 text-sm border rounded"></div>
        <div>
          <label class="block text-xs text-slate-600">Status *</label>
          <select name="status" class="w-full p-2 text-sm border rounded">
            <option>Complete</option>
            <option>Interrupted/Incomplete</option>
            <option>Continued in another videoclip</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div><label class="block text-xs text-slate-600">Unique Objects (Separated by commas)</label><input type="text" name="uniqueObjects" placeholder="knife, cutting board, bowl" class="w-full p-2 text-sm border rounded"></div>
        <div><label class="block text-xs text-slate-600">Dynamic Objects (Separated by commas)</label><input type="text" name="dynamicObjects" placeholder="water, soap foam" class="w-full p-2 text-sm border rounded"></div>
      </div>

      <div>
        <label class="block text-xs text-slate-600">Task Description</label>
        <textarea name="description" rows="2" placeholder="Describe the specific action performed..." class="w-full p-2 text-sm border rounded"></textarea>
      </div>
    `;
    subContainer.appendChild(subCard);
  }

  // Add initial video card on load
  addVideoCard();

  // 5. FORM SUBMISSION LISTENER
  document.getElementById('loggerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'Submitting Data...';

    const commonInfo = {
      userId: document.getElementById('userId').value,
      recordingDate: document.getElementById('recordingDate').value,
      deviceType: document.getElementById('deviceType').value,
      brand: document.getElementById('brand').value,
      model: document.getElementById('model').value,
      storage: document.getElementById('storage').value,
      taskCategory: document.getElementById('taskCategory').value,
      taskSubCategory: document.getElementById('taskSubCategory').value
    };

    const videoCards = document.querySelectorAll('.video-card');
    const videos = Array.from(videoCards).map(card => {
      const subtaskCards = card.querySelectorAll('.subtask-card');
      const subtasks = Array.from(subtaskCards).map(sub => ({
        taskRecorded: sub.querySelector('[name="taskRecorded"]').value,
        startTime: sub.querySelector('[name="startTime"]').value,
        finishTime: sub.querySelector('[name="finishTime"]').value,
        status: sub.querySelector('[name="status"]').value,
        uniqueObjects: sub.querySelector('[name="uniqueObjects"]').value,
        dynamicObjects: sub.querySelector('[name="dynamicObjects"]').value,
        description: sub.querySelector('[name="description"]').value
      }));

      return {
        fileName: card.querySelector('[name="fileName"]').value,
        fileType: card.querySelector('[name="fileType"]').value,
        length: card.querySelector('[name="length"]').value,
        peopleCount: card.querySelector('[name="peopleCount"]').value,
        subtasks: subtasks
      };
    });

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ commonInfo, videos })
    }).then(() => {
      alert('All metadata entries and subtasks successfully logged!');

      // Update submit button state without refreshing page
      btn.disabled = false;
      btn.innerText = 'Submit Another Batch for Today';
      btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
      btn.classList.add('bg-blue-600', 'hover:bg-blue-700');

    }).catch(err => {
      alert('Error submitting data: ' + err);
      btn.disabled = false;
      btn.innerText = 'Submit Log';
    });
  });
</script>
</body>
</html>
